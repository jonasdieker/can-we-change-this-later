<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Walnut Scribe - Symptom Diary</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Vendor libraries via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
  <div id="app-shell">
    <header class="app-header">
      <div class="header-main">
        <div class="header-title-group">
          <h1 class="app-title">Walnut</h1>
          <p class="app-subtitle">Smart Health Memory</p>
        </div>
      </div>
    </header>

    <main class="app-main">
      <!-- Home Tab -->
      <section id="tab-home" class="tab-panel active">
        <div class="home-hero">
          <img src="assets/icons/walnut.svg" alt="Walnut Scribe mascot" class="walnut-hero" />

          <!-- Entry Chat Overlay (hidden by default) -->
          <div id="entry-chat-overlay" class="entry-chat-overlay hidden">
            <div class="entry-chat-header">
              <img src="assets/icons/walnut.svg" alt="Walnut" class="entry-chat-icon" />
              <h3 class="entry-chat-title">Entry Recorded</h3>
              <button id="entry-chat-close" class="entry-chat-close" aria-label="Close">&times;</button>
            </div>
            <div id="entry-chat-response" class="entry-chat-response">
              <!-- Response text will be inserted here -->
            </div>
          </div>
        </div>
        <div class="home-actions">
          <button id="btn-entry-voice" class="primary-circle-btn voice-btn">
            <img src="assets/icons/walnut.svg" alt="Voice entry" class="circle-btn-icon walnut-icon" />
            <span class="circle-btn-label">Voice entry</span>
          </button>
          <button id="btn-entry-text" class="primary-circle-btn text-btn">
            <img src="assets/icons/book.svg" alt="Text entry" class="circle-btn-icon" />
            <span class="circle-btn-label">Text entry</span>
          </button>
        </div>
      </section>

      <!-- Timeline Tab -->
      <section id="tab-timeline" class="tab-panel">
        <header class="panel-header">
          <h2>Timeline</h2>
        </header>
        <div id="timeline-chart" class="timeline-chart"></div>
        <div class="timeline-spacer"></div>
        <aside class="card details-card">
          <h3 class="card-title">Symptom details</h3>
          <p class="placeholder" id="details-placeholder">Click a square in the grid to see its details here.</p>
          <div class="details-list hidden" id="details-list">
            <div class="details-left">
              <dl>
                <div>
                  <dt>Date</dt>
                  <dd id="detail-date"></dd>
                </div>
                <div>
                  <dt>Group</dt>
                  <dd id="detail-group"></dd>
                </div>
                <div>
                  <dt>Intensity</dt>
                  <dd id="detail-intensity"></dd>
                </div>
              </dl>
            </div>
            <div class="details-right">
              <dl>
                <div>
                  <dt>Description</dt>
                  <dd id="detail-description"></dd>
                </div>
              </dl>
            </div>
          </div>
        </aside>
      </section>

      <!-- Summary Tab -->
      <section id="tab-summary" class="tab-panel">
        <header class="panel-header summary-header">
          <div class="summary-header-left">
            <img src="assets/icons/walnut.svg" alt="Walnut Scribe mini" class="walnut-mini" />
            <div>
              <h2>Summary</h2>
            </div>
          </div>
        </header>

        <!-- Hidden elements required by JavaScript -->
        <span id="summary-instruction" class="hidden"></span>
        <span id="summary-selected-group" class="hidden"></span>
        <span id="summary-csv-status" class="hidden"></span>

        <div class="summary-actions-row">
          <button id="btn-summary-voice" class="primary-circle-btn voice-btn">
            <img src="assets/icons/walnut.svg" alt="Record summary instruction" class="circle-btn-icon walnut-icon" />
            <span class="circle-btn-label">Voice instruction</span>
          </button>
          <button id="btn-summary-text" class="primary-circle-btn text-btn">
            <img src="assets/icons/book.svg" alt="Typed summary instruction" class="circle-btn-icon" />
            <span class="circle-btn-label">Text instruction</span>
          </button>
        </div>

        <section class="card summary-output-card">
          <div id="summary-html" class="summary-html">
            <p class="placeholder">No summary yet. Record or type an instruction to generate one.</p>
          </div>
        </section>

        <div class="export-actions">
          <button id="btn-export-pdf" class="btn primary-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Export PDF
          </button>
          <button id="btn-send-doctor" class="btn primary-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 2L11 13"/>
              <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
            Send to Doctor
          </button>
        </div>
      </section>
    </main>

    <!-- Bottom navigation -->
    <nav class="bottom-nav">
      <button class="nav-circle-btn active" data-tab-target="home">
        <div class="nav-circle-icon nav-home">
          <img src="assets/icons/home.svg" alt="Home" />
        </div>
      </button>
      <button class="nav-circle-btn" data-tab-target="timeline">
        <div class="nav-circle-icon nav-timeline">
          <img src="assets/icons/timeline.svg" alt="Timeline" />
        </div>
      </button>
      <button class="nav-circle-btn" data-tab-target="summary">
        <div class="nav-circle-icon nav-summary">
          <img src="assets/icons/summary.svg" alt="Summary" />
        </div>
      </button>
    </nav>
  </div>

  <!-- Modal -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal">
      <header class="modal-header">
        <h3 id="modal-title">Modal title</h3>
        <button id="modal-close" class="btn-icon-only" aria-label="Close modal">&times;</button>
      </header>
      <div class="modal-body">
        <label id="modal-label" for="modal-textarea" class="modal-label"></label>
        <textarea id="modal-textarea" rows="6" class="modal-textarea"></textarea>
      </div>
      <footer class="modal-footer">
        <button id="modal-cancel" class="btn ghost-btn">Cancel</button>
        <button id="modal-send" class="btn primary-btn">Send</button>
      </footer>
    </div>
  </div>

  <!-- Toasts -->
  <div id="toast-container" class="toast-container"></div>

  <!-- App entrypoint -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
